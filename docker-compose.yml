version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dpi-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    container_name: dpi-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: dpi-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/packet_analyzer
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: dpi-client
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongodb_data:
